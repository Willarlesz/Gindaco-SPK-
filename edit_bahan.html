<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Stok Bahan - GINDACO Mall Artha Gading</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-light">

    <!-- NAVBAR CONTAINER -->
    <div id="navbar-container"></div>

    <div class="container py-5" style="max-width: 650px;">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="bahan.html" class="text-decoration-none text-muted">Data Bahan</a></li>
                <li class="breadcrumb-item active text-danger fw-semibold" aria-current="page">Edit Stok</li>
            </ol>
        </nav>

        <div class="modern-card">
            <div class="modern-card-header bg-light">
                <div class="d-flex align-items-center gap-3">
                    <div class="brand-icon" style="width: 44px; height: 44px; font-size: 1.1rem; background: linear-gradient(135deg, #c01b22, #ea580c); color: #fff;">
                        <i class="fas fa-boxes-stacked"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-0 text-dark">Edit Stok &amp; Safety Stock</h5>
                        <span class="text-muted small">Update kuantitas fisik gudang Gindaco</span>
                    </div>
                </div>
                <span class="badge bg-secondary font-monospace" id="badgeKodeBahan">-</span>
            </div>

            <div class="modern-card-body p-4">
                <!-- Item Info Box -->
                <div class="p-3 bg-light rounded-3 border mb-4 d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-muted small d-block">Nama Bahan Baku:</span>
                        <strong class="text-dark fs-6" id="labelNamaBahan">-</strong>
                    </div>
                    <div class="text-end">
                        <span class="text-muted small d-block">Satuan:</span>
                        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 fw-bold px-2 py-1" id="badgeSatuan">
                            -
                        </span>
                    </div>
                </div>

                <form id="formEditBahan" onsubmit="event.preventDefault(); submitEditBahan();">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark small text-uppercase">Nama Bahan Baku</label>
                        <input type="text" id="inputNamaBahan" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark small text-uppercase">Satuan Ukuran</label>
                        <input type="text" id="inputSatuan" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark small text-uppercase">Stok Fisik Aktual (Gudang)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="fas fa-warehouse"></i></span>
                            <input type="number" step="0.01" min="0" class="form-control font-monospace fw-bold" id="inputStokAktual" required>
                        </div>
                        <span class="form-text text-muted small">Jumlah fisik riil yang ada di outlet Mall Artha Gading saat ini.</span>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark small text-uppercase">Safety Stock Acuan</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="fas fa-shield-halved"></i></span>
                            <input type="number" step="0.01" min="0" class="form-control font-monospace fw-bold" id="inputSafetyStock" required>
                        </div>
                        <span class="form-text text-muted small">Batas minimal stok cadangan darurat.</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="bahan.html" class="btn btn-outline-secondary px-3">
                            <i class="fas fa-arrow-left me-1"></i> Kembali
                        </a>
                        <button type="submit" class="btn btn-gindaco px-4 fw-bold">
                            <i class="fas fa-save me-1"></i> Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Seed & DB Engine -->
    <script src="assets/js/seed_data.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/components.js"></script>

    <script>
    let currentBahanId = 0;
    let currentItem = null;

    document.addEventListener("DOMContentLoaded", function() {
        Components.renderNavbar('bahan');

        const params = new URLSearchParams(window.location.search);
        currentBahanId = parseInt(params.get('id'), 10);
        if (!currentBahanId) {
            window.location.href = 'bahan.html';
            return;
        }

        currentItem = GindacoDB.getBahanById(currentBahanId);
        if (!currentItem) {
            alert('Bahan baku tidak ditemukan!');
            window.location.href = 'bahan.html';
            return;
        }

        document.getElementById('badgeKodeBahan').innerText = currentItem.kode_bahan;
        document.getElementById('labelNamaBahan').innerText = currentItem.nama_bahan;
        document.getElementById('badgeSatuan').innerText = currentItem.satuan;
        document.getElementById('inputNamaBahan').value = currentItem.nama_bahan;
        document.getElementById('inputSatuan').value = currentItem.satuan;
        document.getElementById('inputStokAktual').value = currentItem.stok_aktual;
        document.getElementById('inputSafetyStock').value = currentItem.safety_stock;
    });

    function submitEditBahan() {
        if (!currentItem) return;

        const updated = GindacoDB.updateBahanBaku(currentBahanId, {
            kode_bahan: currentItem.kode_bahan,
            nama_bahan: document.getElementById('inputNamaBahan').value.trim(),
            satuan: document.getElementById('inputSatuan').value.trim(),
            stok_aktual: parseFloat(document.getElementById('inputStokAktual').value) || 0,
            safety_stock: parseFloat(document.getElementById('inputSafetyStock').value) || 0
        });

        if (updated) {
            alert('Stok dan data bahan baku berhasil diperbarui!');
            window.location.href = 'bahan.html';
        }
    }
    </script>
</body>
</html>
