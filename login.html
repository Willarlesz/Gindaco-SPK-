<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPK Pengadaan Bahan Gindaco</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #18181b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="p-4 p-sm-5">
            <!-- Header Brand -->
            <div class="text-center mb-4">
                <img src="assets/img/gindaco_logo.webp" alt="Gindaco Logo" style="height: 50px; width: auto; object-fit: contain;" class="mb-3">
                <h4 class="fw-bold text-dark mb-1">GINDACO SPK</h4>
                <p class="text-muted small mb-0">Mall Artha Gading &bull; Portal Pengadaan</p>
            </div>

            <div id="alertBox"></div>

            <!-- ONE CLICK QUICK DEMO LOGIN BUTTONS -->
            <div class="mb-4 p-3 bg-light rounded-3 border">
                <span class="text-muted small fw-bold d-block text-center text-uppercase mb-2">Akses Cepat Demo:</span>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-outline-danger btn-sm fw-bold" onclick="quickLogin('manager')">
                        <i class="fas fa-user-tie me-2"></i>Masuk sebagai Store Manager
                    </button>
                    <button type="button" class="btn btn-outline-primary btn-sm fw-bold" onclick="quickLogin('staff')">
                        <i class="fas fa-user-gear me-2"></i>Masuk sebagai Staff Inventory
                    </button>
                </div>
            </div>

            <div class="position-relative text-center my-3">
                <hr class="text-muted opacity-25">
                <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 small text-muted">atau via form NIK</span>
            </div>

            <!-- FORM LOGIN -->
            <form id="loginForm" onsubmit="event.preventDefault(); submitLogin();">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Nomor Induk Karyawan (NIK)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-id-badge"></i></span>
                        <input type="text" id="inputNik" class="form-control border-start-0 font-monospace" placeholder="manager / staff" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-dark">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                        <input type="password" id="inputPassword" class="form-control border-start-0" placeholder="password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gindaco w-100 py-2 fw-bold shadow-sm mb-3">
                    <i class="fas fa-arrow-right-to-bracket me-1"></i> Masuk ke Sistem
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <span class="text-muted small">Belum memiliki akun?</span>
                <a href="register.html" class="small fw-bold text-danger text-decoration-none ms-1">Daftar Staff Baru</a>
            </div>
        </div>
    </div>

    <!-- App Seed & DB Engine -->
    <script src="assets/js/seed_data.js"></script>
    <script src="assets/js/db.js"></script>

    <script>
    function quickLogin(role) {
        const users = GindacoDB.getUsers();
        const user = users.find(u => u.level === role) || users[0];
        GindacoDB.setCurrentUser(user);
        window.location.href = 'index.html';
    }

    function submitLogin() {
        const nik = document.getElementById('inputNik').value.trim();
        const pass = document.getElementById('inputPassword').value;

        const res = GindacoDB.login(nik, pass);
        if (res.success) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('alertBox').innerHTML = `
                <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3">
                    <i class="fas fa-circle-exclamation me-1"></i> ${res.message}
                </div>
            `;
        }
    }
    </script>
</body>
</html>
