<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - GINDACO SPK</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 85% 15%, #1e1b4b 0%, #0f172a 45%, #050505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #c01b22 0%, #8c0f14 100%);
            padding: 26px 24px 20px;
            text-align: center;
            color: #fff;
        }
        .auth-logo {
            width: 60px; height: 60px;
            margin: 0 auto 10px;
            background: #fff;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            padding: 8px;
        }
        .auth-logo img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .form-control:focus, .form-select:focus {
            border-color: #c01b22;
            box-shadow: 0 0 0 3px rgba(192,27,34,0.15);
        }
        .btn-primary-gdc {
            background: linear-gradient(135deg, #c01b22, #a1141a);
            color: #fff; border: none;
            padding: 11px; font-weight: 700; border-radius: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(192,27,34,0.3);
        }
        .btn-primary-gdc:hover {
            background: linear-gradient(135deg, #a1141a, #830e13);
            color: #fff; transform: translateY(-1px);
        }
        .btn-primary-gdc:disabled { opacity: 0.7; transform: none; }
        .manager-code-box {
            background: #fff1f2;
            border: 2px dashed #f43f5e;
            border-radius: 12px;
            padding: 14px;
            animation: fadeDown 0.25s ease;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <img src="assets/img/gindaco_logo.webp" alt="Gindaco Logo">
            </div>
            <h5 class="fw-bold mb-0">GINDACO SPK</h5>
            <p class="small text-white-50 mb-0 mt-1">Daftar Akun Baru</p>
        </div>

        <div class="p-4">
            <div id="alertBox"></div>

            <form id="registerForm" onsubmit="event.preventDefault(); submitRegister();" novalidate>

                <!-- Nama Lengkap -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Nama Lengkap</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-user fa-sm"></i></span>
                        <input type="text" id="regNama" class="form-control border-start-0"
                               placeholder="Nama lengkap Anda" required>
                    </div>
                </div>

                <!-- Username / NIK -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Username / NIK</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-at fa-sm"></i></span>
                        <input type="text" id="regNik" class="form-control border-start-0 font-monospace"
                               placeholder="Username unik untuk login" required>
                    </div>
                </div>

                <!-- Cabang / Outlet (Dropdown) -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Cabang / Outlet</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-store fa-sm"></i></span>
                        <select id="regOutlet" class="form-select border-start-0" required>
                            <option value="" disabled selected>— Pilih Cabang —</option>
                            <option>GDC AEON SENTUL</option>
                            <option>GDC DARMO SURABAYA</option>
                            <option>GDC DP MALL SEMARANG</option>
                            <option>GDC EPIWALK</option>
                            <option>GDC GRAND INDONESIA</option>
                            <option>GDC KAWAN LAMA</option>
                            <option>GDC KOTA KASABLANKA</option>
                            <option>GDC LIPPO KEMANG</option>
                            <option>GDC LIPPO MALL PURI</option>
                            <option>GDC LIPPO NUSANTARA</option>
                            <option>GDC LOTTE AVENUE</option>
                            <option>GDC LP BINTARO</option>
                            <option>GDC LP PURI PX</option>
                            <option>GDC LW ALAM SUTERA</option>
                            <option>GDC LW DENPASAR</option>
                            <option>GDC LW KOTA WISATA</option>
                            <option>GDC MAL ARTHA GADING 2</option>
                            <option>GDC MANGGA BESAR</option>
                            <option>GDC PAKUWON MALL YOGYA</option>
                            <option>GDC SUMMARECON MALL BEKASI</option>
                            <option>GDC TANJUNG DUREN RAYA</option>
                            <option>GDC TEBET RAYA</option>
                            <option>GDC YOKOCHO CENTRAL PARK</option>
                        </select>
                    </div>
                </div>

                <!-- Peran / Role -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Peran</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-user-shield fa-sm"></i></span>
                        <select id="regLevel" class="form-select border-start-0" onchange="onRoleChange()">
                            <option value="staff" selected>Staff / Crew</option>
                            <option value="manager">Store Manager</option>
                        </select>
                    </div>
                </div>

                <!-- Kode Otorisasi Manager (Dinamis) -->
                <div id="managerCodeGroup" class="manager-code-box mb-3" style="display:none;">
                    <label class="form-label small fw-bold text-danger mb-2">
                        <i class="fas fa-shield-halved me-1"></i>Kode Otorisasi Store Manager
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-danger border-end-0 border-danger"><i class="fas fa-key fa-sm"></i></span>
                        <input type="password" id="regManagerCode"
                               class="form-control border-start-0 border-end-0 border-danger font-monospace"
                               placeholder="Masukkan kode otorisasi">
                        <button class="btn btn-outline-danger" type="button"
                                onclick="togglePwd('regManagerCode','toggleSecretIcon')">
                            <i class="fas fa-eye fa-sm" id="toggleSecretIcon"></i>
                        </button>
                    </div>
                    <p class="small text-danger opacity-75 mt-2 mb-0" style="font-size:0.75rem;">
                        <i class="fas fa-circle-info me-1"></i>
                        Hubungi manajemen jika belum menerima kode otorisasi.
                    </p>
                </div>

                <!-- Password & Konfirmasi (berdampingan) -->
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock fa-sm"></i></span>
                            <input type="password" id="regPassword"
                                   class="form-control border-start-0 border-end-0"
                                   placeholder="Min. 4 karakter" required>
                            <button class="btn btn-light border border-start-0 text-muted" type="button"
                                    onclick="togglePwd('regPassword','togglePwdIcon')">
                                <i class="fas fa-eye fa-sm" id="togglePwdIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-dark">Konfirmasi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock fa-sm"></i></span>
                            <input type="password" id="regPasswordConfirm"
                                   class="form-control border-start-0"
                                   placeholder="Ulangi password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btnSubmitRegister" class="btn btn-primary-gdc w-100">
                    <i class="fas fa-user-plus me-2"></i>Daftarkan Akun
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <span class="text-muted small">Sudah punya akun?</span>
                <a href="login.html" class="small fw-bold text-danger text-decoration-none ms-1">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script src="assets/js/seed_data.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const MANAGER_SECRET_CODE = 'GINDACO-SM-2026';

    function onRoleChange() {
        const isManager = document.getElementById('regLevel').value === 'manager';
        const box   = document.getElementById('managerCodeGroup');
        const input = document.getElementById('regManagerCode');
        box.style.display = isManager ? 'block' : 'none';
        if (isManager) { input.setAttribute('required',''); input.focus(); }
        else           { input.removeAttribute('required'); input.value = ''; }
    }

    function togglePwd(inputId, iconId) {
        const el = document.getElementById(inputId);
        const ic = document.getElementById(iconId);
        const isPass = el.type === 'password';
        el.type = isPass ? 'text' : 'password';
        ic.className = isPass ? 'fas fa-eye-slash fa-sm' : 'fas fa-eye fa-sm';
    }

    function showAlert(message, type) {
        const box = document.getElementById('alertBox');
        box.innerHTML = `
            <div class="alert alert-${type} py-2 px-3 small rounded-3 mb-3 alert-dismissible fade show">
                <i class="fas ${type === 'danger' ? 'fa-triangle-exclamation' : 'fa-circle-check'} me-1"></i>
                ${message}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
            </div>`;
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function submitRegister() {
        const nama        = document.getElementById('regNama').value.trim();
        const nik         = document.getElementById('regNik').value.trim();
        const outlet      = document.getElementById('regOutlet').value;
        const role        = document.getElementById('regLevel').value;
        const pass        = document.getElementById('regPassword').value;
        const passConfirm = document.getElementById('regPasswordConfirm').value;
        const secretCode  = document.getElementById('regManagerCode').value.trim();

        if (!nama)   { showAlert('Nama lengkap wajib diisi.', 'danger'); return; }
        if (!nik)    { showAlert('Username / NIK wajib diisi.', 'danger'); return; }
        if (!outlet) { showAlert('Silakan pilih cabang terlebih dahulu.', 'danger'); return; }
        if (!pass)   { showAlert('Password wajib diisi.', 'danger'); return; }
        if (pass.length < 4) { showAlert('Password minimal 4 karakter.', 'danger'); return; }
        if (pass !== passConfirm) { showAlert('Konfirmasi password tidak cocok.', 'danger'); return; }

        if (role === 'manager') {
            if (!secretCode) {
                showAlert('Kode otorisasi Store Manager wajib diisi.', 'danger');
                document.getElementById('regManagerCode').focus();
                return;
            }
            if (secretCode !== MANAGER_SECRET_CODE) {
                showAlert('<strong>Otorisasi Ditolak.</strong> Kode otorisasi Store Manager tidak valid.', 'danger');
                return;
            }
        }

        const btn = document.getElementById('btnSubmitRegister');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Mendaftarkan...';

        setTimeout(() => {
            const res = window.GindacoDB.register(nik, nama, pass, role, outlet, secretCode);
            if (res.success) {
                showAlert(`Akun <strong>${nama}</strong> berhasil dibuat. Mengalihkan ke login...`, 'success');
                setTimeout(() => window.location.replace('login.html'), 1200);
            } else {
                showAlert(res.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Daftarkan Akun';
            }
        }, 250);
    }
    </script>
</body>
</html>
