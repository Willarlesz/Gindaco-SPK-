<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Staff - GINDACO Mall Artha Gading</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #18181b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="p-4 p-sm-5">
            <div class="text-center mb-4">
                <img src="assets/img/gindaco_logo.webp" alt="Gindaco Logo" style="height: 48px; width: auto; object-fit: contain;" class="mb-3">
                <h4 class="fw-bold text-dark mb-1">Daftar Akun Staff</h4>
                <p class="text-muted small mb-0">GINDACO &bull; Mall Artha Gading</p>
            </div>

            <div id="alertBox"></div>

            <form id="registerForm" onsubmit="event.preventDefault(); submitRegister();">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Nomor Induk Karyawan (NIK)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fas fa-id-badge"></i></span>
                        <input type="text" id="regNik" class="form-control font-monospace" placeholder="Misal: 2026001" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Nama Lengkap Karyawan</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fas fa-user"></i></span>
                        <input type="text" id="regNama" class="form-control" placeholder="Nama lengkap Anda" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Peran / Posisi</label>
                    <select id="regLevel" class="form-select">
                        <option value="staff" selected>Staff Inventory / Gudang</option>
                        <option value="manager">Store Manager</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-dark">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fas fa-lock"></i></span>
                        <input type="password" id="regPassword" class="form-control" placeholder="Minimal 6 karakter" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gindaco w-100 py-2 fw-bold shadow-sm mb-3">
                    <i class="fas fa-user-plus me-1"></i> Daftarkan Akun
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <span class="text-muted small">Sudah memiliki akun?</span>
                <a href="login.html" class="small fw-bold text-danger text-decoration-none ms-1">Masuk Sekarang</a>
            </div>
        </div>
    </div>

    <!-- App Seed & DB Engine -->
    <script src="assets/js/seed_data.js"></script>
    <script src="assets/js/db.js"></script>

    <script>
    function submitRegister() {
        const nik = document.getElementById('regNik').value.trim();
        const nama = document.getElementById('regNama').value.trim();
        const level = document.getElementById('regLevel').value;
        const pass = document.getElementById('regPassword').value;

        if (!nik || !nama || !pass) {
            alert('Mohon isi semua data!');
            return;
        }

        const res = GindacoDB.register(nik, nama, pass, level);
        if (res.success) {
            alert('Pendaftaran berhasil! Silakan masuk dengan akun baru Anda.');
            window.location.href = 'login.html';
        } else {
            document.getElementById('alertBox').innerHTML = `
                <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3">
                    <i class="fas fa-circle-exclamation me-1"></i> ${res.message}
                </div>
            `;
        }
    }
    </script>
</body>
</html>
